security:
  user:
    name: buzz
    password: infinity

taco:
  orders:
    pageSize: 10

tacocloud:
  messaging:
    transport: noop


  discount:
    codes:
      abcdef:
        type: PERCENTAGE
        amount: 0.10
        validFrom: "2023-01-01"
        validUntil: "2030-12-31"
        minPurchase: 0.0



#logging:
