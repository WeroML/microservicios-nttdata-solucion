# Ejemplo de propiedades de Artemis. Las credenciales nunca se guardan en Git:
# se leen de variables de ambiente (TC-28).
spring:
  artemis:
    host: ${ARTEMIS_HOST:localhost}
    port: ${ARTEMIS_PORT:61616}
    user: ${ARTEMIS_USER:}
    password: ${ARTEMIS_PASSWORD:}
    embedded:
      enabled: false

tacocloud:
  messaging:
    jms:
      destination: tacocloud.order.queue
